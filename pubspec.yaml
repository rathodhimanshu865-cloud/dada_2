name: dada_2
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.0
  provider: ^6.1.2
  table_calendar: ^3.2.1
  intl: ^0.20.3
  add_2_calendar: ^3.1.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  file_picker: ^12.1.1
  firebase_storage: ^13.4.6
  path: ^1.8.3
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  google_fonts: ^8.2.0
  http: ^1.6.0
  flutter_widget_from_html: ^0.17.2
  flutter_quill: ^11.5.1
  vsc_quill_delta_to_html: ^1.0.5
  flutter_quill_delta_from_html: ^1.0.0
  razorpay_flutter: ^1.4.5
  cloud_functions: ^6.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

# =============================================================================
# CONSOLIDATED CONFIGURATIONS
# Note: Flutter tools specifically require 'l10n.yaml' and 'analysis_options.yaml'
# to be present at the root for their respective functions (localization and linting).
# These entries are consolidated here for your central access.
# =============================================================================

l10n_config:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-class: AppLocalizations

analysis_options_config:
  analyzer:
    exclude:
      - build/**
      - android/**
      - ios/**
      - web/**
      - windows/**
      - macos/**
      - linux/**
  include: package:flutter_lints/flutter.yaml
  linter:
    rules:

devtools_options_config:
  description: This file stores settings for Dart & Flutter DevTools.
  documentation: https://docs.flutter.dev/tools/devtools/extensions#configure-extension-enablement-states
  extensions:
