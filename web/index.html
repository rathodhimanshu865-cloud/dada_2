<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Jignesh Dada Official Website">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pu. Jignesh Dada">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pu. Jignesh Dada</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #F9F3EA !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .loading-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #0F4C5C;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 32px rgba(15, 76, 92, 0.2);
    }
    .loading-logo-text {
      color: #F9F3EA;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(193, 154, 107, 0.2); /* Gold subtle */
      border-top: 4px solid #C19A6B; /* Gold */
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .loading-text {
      color: #0F4C5C;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="loading-logo">
      <span class="loading-logo-text">JD</span>
    </div>
    <div class="spinner"></div>
    <div class="loading-text">Loading Experience...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
